nt-Descent.pdf"},{"number":5,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL/05-Optimization.pdf"},{"number":6,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL/06-Capacity-Regularization-Hyperparameters.pdf"},{"number":7,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL/07-ConvolutionalNeuralNetworks.pdf"},{"number":8,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL/08-CNNs-for-Image-Classification.pdf"},{"number":9,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL/09-Datasets-Hardware.pdf"},{"number":10,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL/10-DensePredictionWithCNNs.pdf"},{"number":11,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL/11-RecurrentNeuralNetworks.pdf"},{"number":12,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL/12-Tokenization_and_WordEmbeddings.pdf"},{"number":13,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL/13-Attention.pdf"},{"number":14,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL/14-TransformerBasics.pdf"},{"number":15,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL/15-PioneeringTransformers.pdf"},{"number":16,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL/16-Multimodal-Vision-And-Language.pdf"},{"number":17,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL/17-Audio-and-ScalingLaws.pdf"},{"number":18,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL/18-FoundationModelsAndPrompts.pdf"},{"number":19,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL/19-TuningFoundationModels.pdf"},{"number":20,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL/20-PracticalSystemsDevelopment.pdf"},{"number":21,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL/21-ModelCompression.pdf"},{"number":22,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL/22-FasterLearningAndInference.pdf"},{"number":23,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL/23-LearningWithLessHumanSupervision.pdf"},{"number":24,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL//24-ResponsibleNNandDL-Part1.pdf"},{"number":26,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL/26-FutureOfNNandDL.pdf"},{"number":27,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL/27-CourseSummary.pdf"}]},{"id":"spring-2026","page":"https://dannagurari.colorado.edu/course/neural-networks-and-deep-learning-spring-2026/","lectures":[{"number":1,"url":"https://home.cs.colorado.edu/~DrG/Courses/2026-Spring-NN/01-Introduction.pdf"},{"number":2,"url":"https://home.cs.colorado.edu/~DrG/Courses/2026-Spring-NN/02-Artificial-Neurons.pdf"},{"number":3,"url":"https://home.cs.colorado.edu/~DrG/Courses/2026-Spring-NN/03-Fully-Connected-NN.pdf"},{"number":4,"url":"https://home.cs.colorado.edu/~DrG/Courses/2026-Spring-NN/04-Recurrent-Neural-Networks.pdf"},{"number":5,"url":"https://home.cs.colorado.edu/~DrG/Courses/2026-Spring-NN/05-Convolutional-Neural-Networks.pdf"},{"number":6,"url":"https://home.cs.colorado.edu/~DrG/Courses/2026-Spring-NN/06-Shallow-Learning.pdf"},{"number":7,"url":"https://home.cs.colorado.edu/~DrG/Courses/2026-Spring-NN/07-Deep-Learning-Birth.pdf"},{"number":8,"url":"https://home.cs.colorado.edu/~DrG/Courses/2026-Spring-NN/08-Quest-for-Depth.pdf"},{"number":9,"url":"https://home.cs.colorado.edu/~DrG/Courses/2026-Spring-NN/09-Labeled-Datasets-and-Hardware-Acceleration.pdf"},{"number":10,"url":"https://home.cs.colorado.edu/~DrG/Courses/2026-Spring-NN/10-Dense-Prediction.pdf"},{"number":11,"url":"https://home.cs.colorado.edu/~DrG/Courses/2026-Spring-NN/11-Multimodal-Vision-And-Language.pdf"},{"number":12,"url":"https://home.cs.colorado.edu/~DrG/Courses/2026-Spring-NN/12-Attention.pdf"},{"number":13,"url":"https://home.cs.colorado.edu/~DrG/Courses/2026-Spring-NN/13-Transformer-Basics.pdf"},{"number":14,"url":"https://home.cs.colorado.edu/~DrG/Courses/2026-Spring-NN/14-Pioneering-Transformers.pdf"},{"number":15,"url":"https://home.cs.colorado.edu/~DrG/Courses/2026-Spring-NN/15-Scaling.pdf"},{"number":16,"url":"https://home.cs.colorado.edu/~DrG/Courses/2026-Spring-NN/16-Foundation-Models-And-Prompts.pdf"},{"number":17,"url":"https://home.cs.colorado.edu/~DrG/Courses/2026-Spring-NN/17-Post-Training-Foundation-Models.pdf"},{"number":20,"url":"https://home.cs.colorado.edu/~DrG/Courses/2026-Spring-NN/20-Sustainable-NN-and-DL.pdf"},{"number":21,"url":"https://home.cs.colorado.edu/~DrG/Courses/2026-Spring-NN/21-Responsible-NN-and-DL.pdf"},{"number":23,"url":"https://home.cs.colorado.edu/~DrG/Courses/2026-Spring-NN/23-CuttingEdgeAndFuture-NN-and-DL.pdf"},{"number":28,"url":"https://home.cs.colorado.edu/~DrG/Courses/2026-Spring-NN/28-Course-Summary.pdf"}]}]''')
          root = pathlib.Path("source-probe")
          context = ssl.create_default_context()
          context.load_verify_locations(cafile=str(root / "issuer.pem"))
          assert context.check_hostname and context.verify_mode == ssl.CERT_REQUIRED
          allowed = {"home.cs.colorado.edu", "home4.cs.colorado.edu", "dannagurari.colorado.edu"}
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.links.append(href)
          requests = []
          page_results = []
          for edition in sources:
              folder = root / edition["id"]
              folder.mkdir()
              catalog = {str(x["number"]): dict(x, url_source="catalog") for x in edition["lectures"]}
              page = {"edition": edition["id"], "url": edition["page"]}
              try:
                  with urllib.request.urlopen(edition["page"], timeout=40, context=context) as response:
                      data = response.read(5_000_001)
                      if len(data) > 5_000_000:
                          raise ValueError("HTML exceeds bounded inspection size")
                      page.update(status=response.status, final_url=response.url,
                                  sha256=hashlib.sha256(data).hexdigest())
                      (folder / "course-page.html").write_bytes(data)
                      parser = Links()
                      parser.feed(data.decode("utf-8", errors="replace"))
                      for href in parser.links:
                          url = urllib.parse.urljoin(response.url, href)
                          parsed = urllib.parse.urlparse(url)
                          match = re.match(r"^(\d{2})[-_].*\.pdf$", pathlib.PurePosixPath(parsed.path).name, re.I)
                          if parsed.hostname in allowed and match:
                              number = int(match.group(1))
                              if str(number) in catalog:
                                  catalog[str(number)] = {"number": number, "url": url, "url_source": "live_official_course_page"}
              except Exception as exc:
                  page["error"] = str(exc)
              page_results.append(page)
              for entry in catalog.values():
                  requests.append(dict(entry, edition=edition["id"]))
          def retrieve(item):
              result = dict(item)
              url = item.get("url")
              if not url:
                  return dict(result, error="No verified official PDF URL")
              try:
                  original = url
                  try:
                      response = urllib.request.urlopen(url, timeout=50, context=context)
                  except urllib.error.HTTPError as exc:
                      if exc.code != 404 or pathlib.PurePosixPath(urllib.parse.urlparse(url).path).suffix:
                          raise
                      url += ".pdf"
                      response = urllib.request.urlopen(url, timeout=50, context=context)
                      result["verified_link_repair"] = {"original": original, "candidate": url, "reason": "Official href without extension returned 404"}
                  with response:
                      data = response.read(50_000_001)
                      if len(data) > 50_000_000:
                          raise ValueError("PDF exceeds bounded inspection size")
                      result.update(status=response.status, final_url=response.url, bytes=len(data),
                                    sha256=hashlib.sha256(data).hexdigest(), is_pdf=data.startswith(b"%PDF"))
                      if result["is_pdf"]:
                          filename = f'{int(item["number"]):02d}.pdf'
                          (root / item["edition"] / filename).write_bytes(data)
                          result["relative_path"] = f'{item["edition"]}/{filename}'
                      else:
                          result["error"] = "Response is not a PDF"
              except Exception as exc:
                  result["error"] = str(exc)
              print(json.dumps(result), flush=True)
              time.sleep(0.1)
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              results = list(pool.map(retrieve, requests))
          (root / "retrieval.json").write_text(json.dumps({"pages": page_results, "pdfs": results}, indent=2))
          print("Verified PDF files:", sum(x.get("is_pdf", False) for x in results), "of", len(results))
          PY
      - name: Retain source evidence for private inspection, not site publication
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: official-colorado-course-files
          path: source-probe
          retention-days: 1
