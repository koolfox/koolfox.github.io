name: Retrieve official Colorado course sources
on:
  push:
    branches: [research/colorado-source-probe-20261024]
    paths: [.github/workflows/colorado-source-probe.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify the published issuer against existing OS trust
        run: |
          mkdir -p source-probe
          curl --fail --silent --show-error --location http://crt.sectigo.com/SectigoPublicServerAuthenticationCAOVR36.crt -o source-probe/issuer.der
          openssl x509 -inform DER -in source-probe/issuer.der -out source-probe/issuer.pem
          openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt source-probe/issuer.pem
      - name: Retrieve official course pages and PDFs with strict HTTPS
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, re, ssl, time
          import urllib.request, urllib.error, urllib.parse
          from html.parser import HTMLParser
          sources = json.loads(r'''[{"id":"spring-2025","page":"https://dannagurari.colorado.edu/course/neural-networks-and-deep-learning-spring-2025/","lectures":[{"number":19,"url":"https://home.cs.colorado.edu/~DrG/Courses/2025-Spring-DL/19-TuningFoundationModels.pdf"}]}]''')
          root = pathlib.Path("source-probe")
          context = ssl.create_default_context()
          context.load_verify_locations(cafile=str(root / "issuer.pem"))
          assert context.check_hostname and context.verify_mode == ssl.CERT_REQUIRED
          allowed = {"home.cs.colorado.edu", "home4.cs.colorado.edu", "dannagurari.colorado.edu"}
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.links.append(href)
          requests = []
          page_results = []
          for edition in sources:
              folder = root / edition["id"]
              folder.mkdir()
              catalog = {str(x["number"]): dict(x, url_source="catalog") for x in edition["lectures"]}
              page = {"edition": edition["id"], "url": edition["page"]}
              try:
                  with urllib.request.urlopen(edition["page"], timeout=40, context=context) as response:
                      data = response.read(5_000_001)
                      if len(data) > 5_000_000:
                          raise ValueError("HTML exceeds bounded inspection size")
                      page.update(status=response.status, final_url=response.url,
                                  sha256=hashlib.sha256(data).hexdigest())
                      (folder / "course-page.html").write_bytes(data)
                      parser = Links()
                      parser.feed(data.decode("utf-8", errors="replace"))
                      for href in parser.links:
                          url = urllib.parse.urljoin(response.url, href)
                          parsed = urllib.parse.urlparse(url)
                          match = re.match(r"^(\d{2})[-_].*\.pdf$", pathlib.PurePosixPath(parsed.path).name, re.I)
                          if parsed.hostname in allowed and match:
                              number = int(match.group(1))
                              if str(number) in catalog:
                                  catalog[str(number)] = {"number": number, "url": url, "url_source": "live_official_course_page"}
              except Exception as exc:
                  page["error"] = str(exc)
              page_results.append(page)
              for entry in catalog.values():
                  requests.append(dict(entry, edition=edition["id"]))
          def retrieve(item):
              result = dict(item)
              url = item.get("url")
              if not url:
                  return dict(result, error="No verified official PDF URL")
              try:
                  original = url
                  try:
                      response = urllib.request.urlopen(url, timeout=50, context=context)
                  except urllib.error.HTTPError as exc:
                      if exc.code != 404 or pathlib.PurePosixPath(urllib.parse.urlparse(url).path).suffix:
                          raise
                      url += ".pdf"
                      response = urllib.request.urlopen(url, timeout=50, context=context)
                      result["verified_link_repair"] = {"original": original, "candidate": url, "reason": "Official href without extension returned 404"}
                  with response:
                      data = response.read(256_000_001)
                      if len(data) > 256_000_000:
                          raise ValueError("PDF exceeds bounded inspection size")
                      result.update(status=response.status, final_url=response.url, bytes=len(data),
                                    sha256=hashlib.sha256(data).hexdigest(), is_pdf=data.startswith(b"%PDF"))
                      if result["is_pdf"]:
                          filename = f'{int(item["number"]):02d}.pdf'
                          (root / item["edition"] / filename).write_bytes(data)
                          result["relative_path"] = f'{item["edition"]}/{filename}'
                      else:
                          result["error"] = "Response is not a PDF"
              except Exception as exc:
                  result["error"] = str(exc)
              print(json.dumps(result), flush=True)
              time.sleep(0.1)
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              results = list(pool.map(retrieve, requests))
          (root / "retrieval.json").write_text(json.dumps({"pages": page_results, "pdfs": results}, indent=2))
          print("Verified PDF files:", sum(x.get("is_pdf", False) for x in results), "of", len(results))
          PY
      - name: Retain source evidence for private inspection, not site publication
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: official-colorado-large-lecture
          path: source-probe
          retention-days: 1
