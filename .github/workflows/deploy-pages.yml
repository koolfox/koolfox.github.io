name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.11.2'
      - name: Export browser Python laboratories
        run: |
          uv sync --project deep-learning/playgrounds --frozen
          uv run --project deep-learning/playgrounds python deep-learning/scripts/export_playgrounds.py --output deep-learning/results/shinylive
          uv sync --project structural-bioinformatics/playgrounds --frozen
          uv run --project structural-bioinformatics/playgrounds python structural-bioinformatics/scripts/export_course_lab.py --output structural-bioinformatics/results/shinylive
      - name: Check scientific code and curated data
        run: |
          uv sync --project structural-bioinformatics --frozen --python 3.13
          uv run --project structural-bioinformatics pytest -q
          uv run --project structural-bioinformatics ruff check structural-bioinformatics scripts/serve_local.py
          uv run --project structural-bioinformatics ruff format --check structural-bioinformatics scripts/serve_local.py
      - name: Check deep learning teaching models
        run: |
          python3 -m unittest discover -s deep-learning/tests -v
          python3 deep-learning/scripts/course_content.py --examples
          python3 deep-learning/scripts/mnist_reference.py
      - name: Assemble public website files
        run: python3 scripts/build_pages.py --output dist/pages
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: structural-bioinformatics/browser-tests/package-lock.json
      - run: npm ci --prefix structural-bioinformatics/browser-tests
      - run: npx --prefix structural-bioinformatics/browser-tests playwright install --with-deps chromium
      - name: Check the exact website artifact before publication
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory dist/pages > /tmp/research-http.log 2>&1 &
          npm --prefix structural-bioinformatics/browser-tests test
      - name: Preserve browser QA screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-qa-${{ github.sha }}
          path: structural-bioinformatics/browser-tests/test-results
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/configure-pages@v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: dist/pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
