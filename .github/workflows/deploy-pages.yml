name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.11.2'
      - name: Check scientific code and curated data
        run: |
          uv sync --project structural-bioinformatics --frozen --python 3.13
          uv run --project structural-bioinformatics pytest -q
          uv run --project structural-bioinformatics ruff check structural-bioinformatics
          uv run --project structural-bioinformatics ruff format --check structural-bioinformatics
      - name: Assemble public website files
        run: python3 scripts/build_pages.py --output dist/pages
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
