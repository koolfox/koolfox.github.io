name: Slide browser inventory calibration

on:
  pull_request:
    paths:
      - .github/workflows/slide-audit-calibration.yml
      - deep-learning/browser-tests/slide-audit.mjs

permissions:
  contents: read
  actions: read

jobs:
  calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.11.2'
      - name: Prepare pinned public laboratory assets
        run: |
          uv run --frozen --project deep-learning/playgrounds python deep-learning/scripts/prepare_shinylive_assets.py --archive "${{ runner.temp }}/danna-shinylive/shinylive-0.10.15.tar.gz"
          uv run --frozen --project deep-learning/playgrounds python deep-learning/scripts/export_playgrounds.py --output deep-learning/results/shinylive
      - name: Build deep-learning site
        run: uv run --no-project --with pypdf==6.21.4 python scripts/build_pages.py --project deep-learning --output dist/pages
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: deep-learning/browser-tests/package-lock.json
      - run: npm ci --prefix deep-learning/browser-tests
      - run: npx --prefix deep-learning/browser-tests playwright install --with-deps chromium
      - name: Measure five slides in two viewports
        run: |
          mkdir -p audit-report
          python3 -m http.server 8000 --bind 127.0.0.1 --directory dist/pages > /tmp/slide-audit-http.log 2>&1 &
          node deep-learning/browser-tests/slide-audit.mjs --base-url http://127.0.0.1:8000 --build-id "$GITHUB_SHA" --sessions 1 --pages 1-5 --viewports 390x844,1440x900 --output audit-report/calibration.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(line) for line in Path('audit-report/calibration.jsonl').read_text().splitlines()]
          assert len(rows) == 10
          assert all(row['status'] != 'error' and row.get('layout') for row in rows), rows
          assert all(row['visual_review'] == 'not_performed' for row in rows)
          PY
      - name: Restore progress from an earlier attempt of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[] | select(.expired == false) | .name' | { grep -F "slide-inventory-$GITHUB_SHA-attempt-" || true; } | sort -V | tail -1)
          if [ -n "$name" ]; then gh run download "$GITHUB_RUN_ID" --name "$name" --dir audit-report; fi
      - name: Inventory all source pages
        run: |
          python3 - <<'PY' > /tmp/slide-sessions.txt
          import glob, json
          from pathlib import Path
          for path in sorted(glob.glob('deep-learning/content/source-slides/spring-2026/s*.json')):
              print(int(Path(path).stem[1:]), len(json.loads(Path(path).read_text())['pages']))
          PY
          while read -r session count; do
            node deep-learning/browser-tests/slide-audit.mjs --base-url http://127.0.0.1:8000 --build-id "$GITHUB_SHA" --sessions "$session" --pages "1-$count" --viewports 390x844,1440x900 --output audit-report/inventory.jsonl
          done < /tmp/slide-sessions.txt
      - name: Upload diagnostic measurements and error screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: slide-inventory-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: audit-report/
          if-no-files-found: ignore
          retention-days: 90
