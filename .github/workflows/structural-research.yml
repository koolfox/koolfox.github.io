name: Structural research checks

on:
  pull_request:
    paths:
      - structural-bioinformatics/**
      - .github/workflows/structural-research.yml
      - AGENTS.md
      - scripts/**
      - start-local.command
  push:
    branches: [main, 'codex/tnf-adalimumab-*']
    paths:
      - structural-bioinformatics/**
      - .github/workflows/structural-research.yml
      - AGENTS.md
      - scripts/**
      - start-local.command

permissions:
  contents: read

jobs:
  scientific-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.11.2'
      - run: uv sync --project structural-bioinformatics --frozen --python 3.13
      - run: uv run --project structural-bioinformatics pytest structural-bioinformatics/tests -q
      - run: uv run --project structural-bioinformatics ruff check structural-bioinformatics scripts/serve_local.py
      - run: uv run --project structural-bioinformatics ruff format --check structural-bioinformatics scripts/serve_local.py

  browser-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: structural-bioinformatics/browser-tests/package-lock.json
      - run: npm ci --prefix structural-bioinformatics/browser-tests
      - run: npx --prefix structural-bioinformatics/browser-tests playwright install --with-deps chromium
      - name: Check the real static research page
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/research-http.log 2>&1 &
          npm --prefix structural-bioinformatics/browser-tests test
