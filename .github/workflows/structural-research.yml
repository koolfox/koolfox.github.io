name: Structural research checks

on:
  pull_request:
    paths:
      - structural-bioinformatics/**
      - .github/workflows/structural-research.yml
      - AGENTS.md
  push:
    branches: [main, 'codex/tnf-adalimumab-*']
    paths:
      - structural-bioinformatics/**
      - .github/workflows/structural-research.yml
      - AGENTS.md

permissions:
  contents: read

jobs:
  scientific-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.11.2'
      - run: uv sync --project structural-bioinformatics --frozen --python 3.13
      - run: uv run --project structural-bioinformatics pytest -q
      - run: uv run --project structural-bioinformatics ruff check structural-bioinformatics
      - run: uv run --project structural-bioinformatics ruff format --check structural-bioinformatics
