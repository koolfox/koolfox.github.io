<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><style>
@font-face{font-family:Vazir;src:url('../assets/vazirmatn-slide.woff2')}*{box-sizing:border-box}body{margin:0;width:1280px;height:720px;background:#fff;color:#19283a;font-family:Vazir,sans-serif}header{height:94px;padding:14px 60px;border-bottom:2px solid #dbe3ec;display:flex;justify-content:space-between;align-items:center}header img{height:64px;filter:brightness(0)}h1{font-size:32px;margin:0;font-weight:700}.content{display:flex;gap:55px;padding:40px 75px;align-items:center}.graph{width:510px;height:480px;flex:none}section{flex:1}h2{font-size:28px;color:#214f9d;margin:0 0 20px}p{font-size:25px;line-height:1.9;margin:0 0 20px}.math{direction:ltr;text-align:left;font:28px/1.8 Menlo,monospace;color:#213e68}.detail{font-size:20px;color:#526278}footer{position:absolute;bottom:20px;left:55px;right:55px;display:flex;justify-content:space-between;color:#526278;font-size:17px}.point{transition:opacity .2s}
</style><header><h1>مرز تصمیم و مساله XOR</h1><img src="../assets/university-logo.png" alt="نشان دانشگاه"></header><main class="content"><svg class="graph" viewBox="0 0 510 480" xmlns="http://www.w3.org/2000/svg"><line x1="78" y1="405" x2="450" y2="405" stroke="#27374c" stroke-width="4"/><line x1="78" y1="405" x2="78" y2="45" stroke="#27374c" stroke-width="4"/><text x="460" y="418" font-size="26">x₁</text><text x="55" y="35" font-size="26">x₂</text><text x="130" y="440" font-size="25">0</text><text x="365" y="440" font-size="25">1</text><text x="40" y="358" font-size="25">0</text><text x="40" y="128" font-size="25">1</text><g fill="none" stroke="#d44848" stroke-width="7"><circle cx="140" cy="348" r="20"/><circle cx="374" cy="118" r="20"/></g><g fill="none" stroke="#2864ca" stroke-width="7"><path d="M140 94 L117 135 L163 135 Z"/><path d="M374 324 L351 365 L397 365 Z"/></g><line id="boundary" x1="75" y1="270" x2="450" y2="200" stroke="#7c899a" stroke-width="4" stroke-dasharray="10 8" opacity="0"/></svg><section><h2 id="heading"></h2><p id="description"></p><div class="math" id="math"></div><p class="detail" id="detail"></p></section></main><footer><span>حسام شینی · استاد: دکتر نگار مجمع</span><span>بر پایه درس Danna Gurari · بهار ۲۰۲۶</span></footer><script>
const t=Number(new URLSearchParams(location.search).get('t')||0),heading=document.querySelector('#heading'),description=document.querySelector('#description'),math=document.querySelector('#math'),detail=document.querySelector('#detail');
if(t<7){heading.textContent='جدول درستی XOR';description.textContent='خروجی فقط وقتی ۱ است که دقیقا یکی از دو ورودی ۱ باشد.';math.innerHTML='(0,0) → 0 &nbsp;&nbsp; (0,1) → 1<br>(1,0) → 1 &nbsp;&nbsp; (1,1) → 0';detail.textContent='دایره قرمز: کلاس صفر · مثلث آبی: کلاس یک';}
else if(t<14){heading.textContent='آیا یک خط کافی است؟';description.textContent='هیچ خطی نمی‌تواند دو مثلث را از هر دو دایره جدا کند.';math.innerHTML='ŷ = 1 &nbsp; if &nbsp; w₁x₁ + w₂x₂ + b ≥ 0<br>ŷ = 0 &nbsp; otherwise';detail.textContent='خط نقطه‌چین فقط یک مرز نمونه است.';const line=document.querySelector('#boundary');line.style.opacity=1;const delta=75*Math.sin((t-7)*Math.PI/3);line.setAttribute('y1',String(235+delta));line.setAttribute('y2',String(235-delta));}
else{heading.textContent='دلیل جبری';description.textContent='برای خروجی صفر در (۰،۰) داریم b < 0؛ برای دو خروجی یک:';math.innerHTML='w₁ + b ≥ 0 , &nbsp; w₂ + b ≥ 0<br>⇒ w₁ + w₂ + b ≥ −b > 0';detail.textContent='پس (۱،۱) نیز یک می‌شود؛ این با جدول XOR تناقض دارد.';}
</script></html>
