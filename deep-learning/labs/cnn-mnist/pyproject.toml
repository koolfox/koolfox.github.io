[project]
name = "danna-cnn-mnist-lab"
version = "0.1.0"
description = "Reproducible original Persian CNN training exercise"
requires-python = ">=3.12,<3.14"
dependencies = ["torch==2.13.0"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }
