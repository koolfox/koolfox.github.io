<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بازبینی گفتار</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><p class="eyebrow">آزمایشگاه داده گفتار</p><h1>بازبینی صوت و متن</h1><p>فایل‌ها در همین مرورگر باز می‌شوند. برای نگه داشتن تغییرات، خروجی بگیرید.</p></div><label class="file-button">باز کردن JSONL<input id="manifest" type="file" accept=".jsonl,application/jsonl,application/x-ndjson"></label></header><div id="empty" class="empty">یک فایل JSONL انتخاب کنید تا بازبینی آغاز شود.</div><div id="workspace" hidden><div class="toolbar"><div><button id="prev" type="button">قبلی</button><button id="next" type="button">بعدی</button><strong id="position"></strong></div><button id="export" class="primary" type="button">دریافت JSONL</button></div><section class="grid"><article><h2>متن نمایشی</h2><p id="display" class="display" dir="auto"></p><p class="hint" id="record-id" dir="ltr"></p><label>فایل صوت WAV<input id="audio" type="file" accept="audio/wav,.wav"></label><audio id="player" controls preload="none"></audio><p id="hash-status" class="hint" role="status"></p><label>مسیر صوت نسبت به ریشه داده<input id="audio_path" dir="ltr" placeholder="audio/example.wav"></label></article><article><h2>گفتار و بازبینی</h2><label>متن گفتار و نشانه‌های تلفظ<textarea id="spoken_text_fa" rows="4"></textarea></label><label>آوانویسی یا راهنمای تلفظ<textarea id="phonemes" rows="2"></textarea></label><div class="twocol"><label>شناسه گوینده<input id="speaker_id" dir="auto"></label><label>بخش<select id="split"><option value="">انتخاب کنید</option><option value="train">آموزش</option><option value="validation">اعتبارسنجی</option><option value="test">آزمون</option></select></label></div><label>حقوق و منبع مجوز<input id="rights" dir="auto" placeholder="شناسه مجوز و منبع"></label><div class="twocol"><label>مکث‌ها<textarea id="pauses" rows="2" placeholder="زمان و توضیح"></textarea></label><label>آواهای گفتاری<textarea id="fillers" rows="2" placeholder="فیلر و زمان"></textarea></label></div><label>وضعیت بازبینی<select id="review_status"><option value="pending">در انتظار</option><option value="approved">تایید شده</option><option value="rejected">رد شده</option></select></label><label class="check"><input id="pronunciation_reviewed" type="checkbox"> تلفظ را شنیده و بررسی کرده‌ام</label><p id="validation" class="hint" role="status"></p></article></section></div><p id="message" role="alert"></p></main><script type="module" src="app.js"></script></body></html>
