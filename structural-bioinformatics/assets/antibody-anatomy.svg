<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title description">
<title id="title">IgG antibody anatomy: two heavy and two light chains</title>
<desc id="description">Conceptual domain diagram, not molecular coordinates. The two Fab arms include heavy and light chains; Fc includes the heavy-chain stem. 3WD5 contains only one Fab fragment bound to TNF.</desc>
<style>text{font-family:Arial,sans-serif;fill:#24314a} .label{font-size:21px;font-weight:600} .note{font-size:17px} .leader{fill:none;stroke:#758096;stroke-width:1.5}</style>
<rect width="900" height="450" fill="#f7f9fc"/>
<text x="32" y="40" class="label">Adalimumab is an IgG1 protein antibody</text>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M310 90 L420 210 L440 245 L440 365" stroke="#a95015" stroke-width="22"/>
<path d="M590 90 L480 210 L460 245 L460 365" stroke="#a95015" stroke-width="22"/>
<path d="M260 130 L355 235" stroke="#245cb7" stroke-width="19"/>
<path d="M640 130 L545 235" stroke="#245cb7" stroke-width="19"/>
<path d="M402 192 L389 204 M498 192 L511 204 M440 248 L460 248 M440 261 L460 261" stroke="#6b7485" stroke-width="3"/>
<rect x="226" y="65" width="200" height="182" rx="12" stroke="#6b7485" stroke-width="1.5" stroke-dasharray="7 5"/>
</g>
<text x="33" y="103" class="label">Fab</text>
<text x="33" y="130" class="note">Antigen recognition</text>
<path class="leader" d="M193 115 L230 115"/>
<text x="680" y="205" class="label">Hinge</text><path class="leader" d="M665 200 L482 235"/>
<text x="560" y="327" class="label">Fc</text>
<text x="560" y="354" class="note">Effector interactions</text><path class="leader" d="M545 333 L477 333"/>
<path d="M45 285 H85" stroke="#a95015" stroke-width="12"/>
<text x="102" y="291" class="note">2 heavy chains (H)</text>
<path d="M45 327 H85" stroke="#245cb7" stroke-width="12"/>
<text x="102" y="333" class="note">2 light chains (L)</text>
<text x="32" y="411" class="note">Schematic, not to scale. 3WD5 shows one Fab + TNF; Fc is absent from that structure.</text>
</svg>
