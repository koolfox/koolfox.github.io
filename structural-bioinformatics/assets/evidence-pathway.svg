<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" role="img" aria-labelledby="title description">
<title id="title">Known drug target and separately tested TOP2A-related observations</title>
<desc id="description">Adalimumab binds TNF and blocks TNF receptor interactions. Separate activated T-cell experiments found increased surface SIRPG after adalimumab, and decreased TOP2A RNA after SIRPG knockout. They do not establish adalimumab to TOP2A mediation or cancer benefit. A dashed line marks the untested connection.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#53617b"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#24314a}.heading{font-size:23px;font-weight:600}.label{font-size:21px;font-weight:600}.note{font-size:17px}.edge{fill:none;stroke:#53617b;stroke-width:2;marker-end:url(#arrow)}.box{fill:#fff;stroke:#aeb9cd;stroke-width:1}</style>
<rect width="1100" height="550" fill="#f7f9fc"/>
<text x="32" y="40" class="heading">Established target and an open, indirect connection</text>
<rect class="box" x="32" y="69" width="238" height="72" rx="12"/><text x="151" y="113" text-anchor="middle" class="label">Adalimumab binds TNF</text>
<path class="edge" d="M273 105 H356"/>
<rect class="box" x="366" y="69" width="330" height="72" rx="12"/><text x="531" y="113" text-anchor="middle" class="label">Blocks TNF–TNFR interaction</text>
<path class="edge" d="M699 105 H778"/>
<rect class="box" x="788" y="69" width="278" height="72" rx="12"/><text x="927" y="99" text-anchor="middle" class="label">RA inflammation</text><text x="927" y="125" text-anchor="middle" class="note">Clinical reduction observed</text>
<text x="32" y="171" class="note">Drug mechanism and RA effects: prescribing label; Fab interface: 3WD5 / Hu 2013.</text>
<path d="M32 190 H1068" stroke="#ccd4e1"/>
<text x="32" y="226" class="heading">Two separate experiments — not a proven mediation chain</text>
<text x="32" y="251" class="note">Activated healthy-donor T cells · Marguerie et al., 2025 · Figure 2</text>
<rect class="box" x="32" y="271" width="238" height="58" rx="12"/><text x="151" y="308" text-anchor="middle" class="label">Adalimumab treatment</text>
<path class="edge" d="M273 299 H356"/>
<rect class="box" x="366" y="271" width="330" height="58" rx="12"/><text x="531" y="308" text-anchor="middle" class="label">Surface SIRPG increases</text>
<text x="730" y="306" class="note">TOP2A effect not established here</text>
<text x="32" y="365" class="note">A different T-cell perturbation · same paper · Figures 3–4</text>
<rect class="box" x="32" y="385" width="238" height="58" rx="12"/><text x="151" y="422" text-anchor="middle" class="label">SIRPG knockout</text>
<path class="edge" d="M273 413 H356"/>
<rect class="box" x="366" y="385" width="430" height="58" rx="12"/><text x="581" y="422" text-anchor="middle" class="label">TOP2A RNA and proliferation decrease</text>
<path class="edge" stroke-dasharray="8 6" d="M270 495 H363"/>
<text x="32" y="501" class="label">Adalimumab</text><text x="385" y="502" class="label">TOP2A change? Direction and mediation remain untested.</text>
<text x="32" y="533" class="note">Solid: measured/established in the named context. Dashed: research hypothesis. No anticancer claim.</text>
</svg>
