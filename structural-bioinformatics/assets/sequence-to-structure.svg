<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="title description">
<title id="title">From a gene to a transcript, a protein and a structure</title>
<desc id="description">DNA is transcribed to mRNA and a coding sequence is translated to protein. A PDB structure is measured separately and often covers a fragment. RNA expression counts and RNA three-dimensional structures are different datasets. Reference mRNA letters T can be converted to U for teaching only.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#53617b"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#24314a}.heading{font-size:23px;font-weight:600}.label{font-size:23px;font-weight:600}.note{font-size:17px}.edge{stroke:#53617b;stroke-width:2;marker-end:url(#arrow)}.box{fill:#fff;stroke:#aeb9cd;stroke-width:1}</style>
<rect width="1100" height="340" fill="#f7f9fc"/>
<text x="32" y="42" class="heading">Sequence, expression and structure answer different questions</text>
<rect class="box" x="32" y="92" width="172" height="88" rx="12"/><text x="118" y="129" text-anchor="middle" class="label">DNA gene</text><text x="118" y="158" text-anchor="middle" class="note">TNF / TOP2A</text>
<path class="edge" d="M208 136 H285"/><text x="213" y="117" class="note">Transcribe</text>
<rect class="box" x="299" y="92" width="188" height="88" rx="12"/><text x="393" y="129" text-anchor="middle" class="label">mRNA</text><text x="393" y="158" text-anchor="middle" class="note">RefSeq NM_</text>
<path class="edge" d="M491 136 H570"/><text x="496" y="117" class="note">Translate</text>
<rect class="box" x="584" y="92" width="188" height="88" rx="12"/><text x="678" y="129" text-anchor="middle" class="label">Protein</text><text x="678" y="158" text-anchor="middle" class="note">RefSeq NP_</text>
<path class="edge" d="M776 136 H875"/><text x="786" y="117" class="note">Experiment</text>
<rect class="box" x="889" y="92" width="179" height="88" rx="12"/><text x="978" y="129" text-anchor="middle" class="label">3D structure</text><text x="978" y="158" text-anchor="middle" class="note">PDB; often a fragment</text>
<text x="32" y="222" class="note">FASTA: the order of letters. RNA-seq: measured transcript counts in a sample.</text>
<text x="32" y="259" class="note">RNA 3D: another structural experiment. The current examples contain protein and DNA, not RNA.</text>
<text x="32" y="302" class="note">An mRNA reference may use T; a labeled T→U display does not measure RNA folding or expression.</text>
</svg>
