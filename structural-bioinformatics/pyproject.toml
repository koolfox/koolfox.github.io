[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tnf-adalimumab-atlas"
version = "0.1.0"
description = "Reproducible TNF-alpha–adalimumab interface analysis and evidence atlas"
requires-python = ">=3.13,<3.15"
dependencies = [
    "biopython>=1.86,<2",
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1"]
animation = ["manimgx==0.1.1"]

[project.scripts]
tnf-atlas = "tnf_atlas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tnf_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
