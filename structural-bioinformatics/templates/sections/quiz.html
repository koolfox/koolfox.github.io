<section id="check" hidden><h3>خودآزمایی</h3>
<p>پاسخ را انتخاب کنید و دلیل آن را بخوانید. می‌توانید دوباره تلاش کنید و نکته‌های خود را یادداشت کنید.</p>
<form id="quiz-form"><fieldset><legend id="quiz-question"></legend><div id="quiz-options"></div></fieldset><button type="submit">بررسی پاسخ</button></form>

<p id="quiz-feedback" role="status" aria-live="polite"></p><p id="quiz-history"></p>
<label for="own-answer">توضیح خودتان یا نکته‌ای که هنوز مبهم است</label><textarea id="own-answer" rows="3" maxlength="10000"></textarea>
<button id="clear-answer" type="button">پاک‌کردن پاسخ‌های همین مبحث</button>
<p>پاسخ‌ها، یادداشت و وضعیت مطالعه در همین مرورگر ذخیره می‌شوند و به سرور فرستاده نمی‌شوند. پاک‌کردن داده‌های مرورگر آن‌ها را حذف می‌کند؛ دستگاه مشترک ممکن است در اختیار دیگران باشد.</p>
